<script>
/* ---------- Fantasy values ----------
   Everything runs in the page so any league format re-prices instantly.
   Categories: z-scores against the drafted pool (rate stats as marginal contributions), positional
   replacement, then auction dollars. Points: totals above replacement, or (games/innings-capped
   leagues like Ottoneu) points per game / per inning above replacement times volume.
   GOOSE extras: dollar ranges from the playing-time and talent distributions, a risk dial,
   healthy value, and a live draft tracker with inflation. */

const r0 = (v) => v || 0;
const HSTAT = (r) => {
  const s = { pa: r0(r.pa), ab: r0(r.ab), h: r0(r.h), b1: r0(r.b1), b2: r0(r.b2), b3: r0(r.b3), hr: r0(r.hr), r: r0(r.r),
    rbi: r0(r.rbi), sb: r0(r.sb), cs: r0(r.cs), bb: r0(r.bb), k: r0(r.k), hbp: r0(r.hbp), sf: r0(r.sf), g: r0(r.g) };
  return s;
};
const tb = (s) => s.b1 + 2 * s.b2 + 3 * s.b3 + 4 * s.hr;

// Category catalog. c: counting (neg = fewer is better); num/den: ratio stats.
const HCATS = [
  { k: "R", f: (s) => s.r }, { k: "HR", f: (s) => s.hr }, { k: "RBI", f: (s) => s.rbi }, { k: "SB", f: (s) => s.sb },
  { k: "NSB", label: "Net SB", f: (s) => s.sb - s.cs }, { k: "AVG", num: (s) => s.h, den: (s) => s.ab, d: 3 },
  { k: "OBP", num: (s) => s.h + s.bb + s.hbp, den: (s) => s.ab + s.bb + s.hbp + s.sf, d: 3 },
  { k: "SLG", num: tb, den: (s) => s.ab, d: 3 },
  { k: "OPS", ops: true, d: 3 }, { k: "ISO", num: (s) => tb(s) - s.h, den: (s) => s.ab, d: 3 },
  { k: "H", f: (s) => s.h }, { k: "1B", f: (s) => s.b1 }, { k: "2B", f: (s) => s.b2 }, { k: "3B", f: (s) => s.b3 },
  { k: "XBH", f: (s) => s.b2 + s.b3 + s.hr }, { k: "TB", f: tb }, { k: "R+RBI", f: (s) => s.r + s.rbi },
  { k: "BB", f: (s) => s.bb }, { k: "HBP", f: (s) => s.hbp }, { k: "K", label: "K (bat)", f: (s) => s.k, neg: true },
  { k: "CS", f: (s) => s.cs, neg: true }, { k: "PA", f: (s) => s.pa }, { k: "AB", f: (s) => s.ab },
];
const PCATS = [
  { k: "W", f: (s) => s.w }, { k: "SV", f: (s) => s.sv }, { k: "K", f: (s) => s.k },
  { k: "ERA", num: (s) => 9 * s.er, den: (s) => s.ip, neg: true, d: 2 }, { k: "WHIP", num: (s) => s.h + s.bb, den: (s) => s.ip, neg: true, d: 2 },
  { k: "QS", f: (s) => s.qs }, { k: "HLD", f: (s) => s.hld }, { k: "SVHD", label: "SV+HLD", f: (s) => s.sv + s.hld },
  { k: "W+QS", f: (s) => s.w + s.qs }, { k: "L", f: (s) => s.l, neg: true }, { k: "IP", f: (s) => s.ip },
  { k: "K/9", num: (s) => 9 * s.k, den: (s) => s.ip, d: 2 }, { k: "BB/9", num: (s) => 9 * s.bb, den: (s) => s.ip, neg: true, d: 2 },
  { k: "HR/9", num: (s) => 9 * s.hr, den: (s) => s.ip, neg: true, d: 2 }, { k: "K/BB", num: (s) => s.k, den: (s) => s.bb, d: 2 },
  { k: "K%", num: (s) => s.k, den: (s) => s.tbf, d: 3, pct: true }, { k: "K-BB%", num: (s) => s.k - s.bb, den: (s) => s.tbf, d: 3, pct: true },
  { k: "H", label: "H (allowed)", f: (s) => s.h, neg: true }, { k: "BB", label: "BB (allowed)", f: (s) => s.bb, neg: true },
  { k: "HRA", label: "HR (allowed)", f: (s) => s.hr, neg: true }, { k: "GS", f: (s) => s.gs },
];
const HPTS = [["pa", "PA"], ["ab", "AB"], ["h", "H"], ["b1", "1B"], ["b2", "2B"], ["b3", "3B"], ["hr", "HR"], ["tb", "TB"],
  ["r", "R"], ["rbi", "RBI"], ["bb", "BB"], ["hbp", "HBP"], ["k", "K"], ["sb", "SB"], ["cs", "CS"]];
const PPTS = [["ip", "IP"], ["k", "K"], ["h", "H"], ["bb", "BB"], ["hbp", "HBP"], ["hr", "HR"], ["er", "ER"], ["w", "W"],
  ["l", "L"], ["sv", "SV"], ["hld", "HLD"], ["qs", "QS"], ["gs", "GS"]];
const ptsOf = (s, w, pit) => (pit ? PPTS : HPTS).reduce((a, [k]) => a + (w[k] || 0) * (k === "tb" ? tb(s) : (s[k] || 0)), 0);

const SLOTS_H = ["C", "1B", "2B", "3B", "SS", "OF", "MI", "CI", "UTIL"];
const SLOTS_P = ["SP", "RP", "P"];
const OTTO_H = { ab: -1, h: 5.6, b2: 2.9, b3: 5.7, hr: 9.4, bb: 3, hbp: 3, sb: 1.9, cs: -2.8 };
const OTTO_ROSTER = { teams: 12, budget: 400, minBid: 1, bench: 18, ipCap: 1500, C: 1, "1B": 1, "2B": 1, "3B": 1, SS: 1, OF: 5, MI: 1, CI: 0, UTIL: 1, SP: 5, RP: 5, P: 0 };
// Platform eligibility rules for a preseason (previous-season) draft. g = games at the position,
// gs = starts there, pct = share of his games (with a games floor); pitchers: sp = starts, rp = relief apps.
const ELIG_RULES = {
  yahoo: { label: "Yahoo (5 starts or 10 G; SP 3 GS, RP 5)", gThr: 10, gsThr: 5, spThr: 3, rpThr: 5 },
  espn: { label: "ESPN (20 G or 25% of games; SP 5 GS, RP 8)", gThr: 20, pct: 0.25, pctMin: 5, spThr: 5, rpThr: 8 },
  cbs: { label: "CBS (20 G, keeps primary position)", gThr: 20, primary: true, spThr: 5, rpThr: 5 },
  nfbc: { label: "NFBC (20 G)", gThr: 20, spThr: 5, rpThr: 5 },
  fantrax: { label: "Fantrax default (20 G, else most-played)", gThr: 20, mostPlayed: true, spThr: 5, rpThr: 5 },
  ottoneu: { label: "Ottoneu (10 G or 5 starts; SP 5 GS, RP 5)", gThr: 10, gsThr: 5, spThr: 5, rpThr: 5 },
};
const eligOf = (k) => ({ rule: k, gsThr: 999, both: false, ...structuredClone(ELIG_RULES[k]) });
const OTTO_ELIG = eligOf("ottoneu");
const STD_ROSTER = { teams: 12, budget: 260, minBid: 1, bench: 6, C: 1, "1B": 1, "2B": 1, "3B": 1, SS: 1, OF: 5, MI: 1, CI: 1, UTIL: 1, SP: 0, RP: 0, P: 9 };
const PRESETS = {
  roto5: { label: "Roto 5x5 (AVG)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG"], pc: ["W", "SV", "K", "ERA", "WHIP"], roster: STD_ROSTER, elig: eligOf("nfbc") },
  rotoObp: { label: "Roto 5x5 (OBP)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "OBP"], pc: ["W", "SV", "K", "ERA", "WHIP"], roster: STD_ROSTER, elig: eligOf("nfbc") },
  nfbc: { label: "NFBC auction (15-team 5x5)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG"], pc: ["W", "SV", "K", "ERA", "WHIP"],
    roster: { ...STD_ROSTER, teams: 15, C: 2, bench: 7 }, elig: eligOf("nfbc"), adp: "aav" },
  nfbcDC: { label: "NFBC Draft Champions (draft & hold, 50 rounds)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG"], pc: ["W", "SV", "K", "ERA", "WHIP"],
    roster: { ...STD_ROSTER, C: 2, bench: 27, waivers: "none", benchP: 0.55 }, elig: eligOf("nfbc"), adp: "dc" },
  nfbcOC: { label: "NFBC Online Championship (12-team 5x5)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG"], pc: ["W", "SV", "K", "ERA", "WHIP"],
    roster: { ...STD_ROSTER, C: 2, bench: 7 }, elig: eligOf("nfbc"), adp: "oc" },
  six: { label: "6x6 (OPS, QS, SV+HLD)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG", "OPS"], pc: ["QS", "SVHD", "K", "ERA", "WHIP", "K/9"], roster: STD_ROSTER, elig: eligOf("nfbc") },
  h2hYahoo: { label: "Yahoo H2H categories", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG"], pc: ["W", "SV", "K", "ERA", "WHIP"],
    roster: { teams: 12, budget: 200, minBid: 1, bench: 5, C: 1, "1B": 1, "2B": 1, "3B": 1, SS: 1, OF: 3, MI: 0, CI: 0, UTIL: 2, SP: 2, RP: 2, P: 4 }, elig: eligOf("yahoo") },
  espnCats: { label: "ESPN H2H categories (6x6)", mode: "cats", hc: ["R", "HR", "TB", "RBI", "SB", "OBP"], pc: ["K", "W", "SVHD", "ERA", "WHIP", "QS"],
    roster: { teams: 10, budget: 260, minBid: 1, bench: 8, C: 1, "1B": 1, "2B": 1, "3B": 1, SS: 1, OF: 3, MI: 0, CI: 0, UTIL: 1, SP: 0, RP: 0, P: 7 }, elig: eligOf("espn") },
  ottoFg: { label: "Ottoneu FanGraphs Points", mode: "pts", rate: true, hw: OTTO_H,
    pw: { ip: 7.4, k: 2, h: -2.6, bb: -3, hbp: -3, hr: -12.3, sv: 5, hld: 4 }, roster: OTTO_ROSTER, elig: OTTO_ELIG },
  ottoSabr: { label: "Ottoneu SABR Points", mode: "pts", rate: true, hw: OTTO_H,
    pw: { ip: 5, k: 2, bb: -3, hbp: -3, hr: -13, sv: 5, hld: 4 }, roster: OTTO_ROSTER, elig: OTTO_ELIG },
  ottoOld: { label: "Ottoneu Old School (5x5)", mode: "cats", hc: ["R", "HR", "RBI", "SB", "AVG"], pc: ["W", "SV", "K", "ERA", "WHIP"], roster: OTTO_ROSTER, elig: OTTO_ELIG },
  ottoClassic: { label: "Ottoneu Classic (4x4)", mode: "cats", hc: ["R", "HR", "OBP", "SLG"], pc: ["K", "ERA", "WHIP", "HR/9"], roster: OTTO_ROSTER, elig: OTTO_ELIG },
  espnPts: { label: "ESPN points", mode: "pts", rate: false, hw: { tb: 1, r: 1, rbi: 1, bb: 1, k: -1, sb: 1 },
    pw: { ip: 3, h: -1, er: -2, bb: -1, k: 1, w: 5, l: -2, sv: 5, hld: 2 },
    roster: { teams: 10, budget: 260, minBid: 1, bench: 8, C: 1, "1B": 1, "2B": 1, "3B": 1, SS: 1, OF: 3, MI: 0, CI: 0, UTIL: 1, SP: 0, RP: 0, P: 7 }, elig: eligOf("espn") },
  yahooPts: { label: "Yahoo points", mode: "pts", rate: false, hw: { b1: 2.6, b2: 5.2, b3: 7.8, hr: 10.4, r: 1.9, rbi: 1.9, bb: 2.6, hbp: 2.6, sb: 4.2 },
    pw: { ip: 3, w: 8, sv: 8, k: 3, er: -3, bb: -1.3, h: -1.3, hbp: -1.3 },
    roster: { teams: 12, budget: 200, minBid: 1, bench: 5, C: 1, "1B": 1, "2B": 1, "3B": 1, SS: 1, OF: 3, MI: 0, CI: 0, UTIL: 2, SP: 2, RP: 2, P: 4 }, elig: eligOf("yahoo") },
};

const FSTATE = (() => {
  const d = { preset: "roto5", custom: false, ...structuredClone(PRESETS.roto5), hw: {}, pw: {}, split: "manual", splitPct: 67, ohtani: "both", adp: "all", risk: 0,
    show: "all", pos: "", q: "", hideDrafted: false, drafted: {}, sort: ["val", -1], sel: null };
  try { const s = JSON.parse(localStorage.getItem("goose-fantasy") || "null"); if (s) Object.assign(d, s); } catch (e) {}
  d.q = ""; d.sel = null;
  return d;
})();
const fsave = () => { try { const { q, sel, ...keep } = FSTATE; localStorage.setItem("goose-fantasy", JSON.stringify(keep)); } catch (e) {} };

function applyPreset(key) {
  const p = structuredClone(PRESETS[key]);
  Object.assign(FSTATE, { preset: key, custom: false, mode: p.mode, rate: !!p.rate, hc: p.hc || FSTATE.hc, pc: p.pc || FSTATE.pc,
    hw: p.hw || FSTATE.hw, pw: p.pw || FSTATE.pw, roster: p.roster, elig: p.elig,
    // Category leagues: z-scores over-reward the side with more roster slots, so default to the
    // market's ~67/33 hitter split. Points share one currency, so the auto split is used.
    split: p.mode === "cats" ? "manual" : "auto", splitPct: 67,
    ohtani: key.startsWith("yahoo") || key === "h2hYahoo" ? "two" : "both", adp: p.adp || "all" });
}
if (!FSTATE.roster) applyPreset("roto5");

/* ---------- player pool ---------- */
function eligible(r) {
  const e = DATA.elig[String(r.id)] || {};
  const E = FSTATE.elig, { gThr, both } = E, gsThr = E.gsThr ?? 999;
  const FIELD = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "DH"];
  const tot = (i) => FIELD.reduce((a, p) => a + (e[p] ? e[p][i] : 0), 0);
  const T = [tot(0), 0, tot(2)];
  const okYr = (v, i) => v[i] >= gThr || v[i + 1] >= gsThr || (E.pct && v[i] >= (E.pctMin ?? 5) && v[i] >= E.pct * T[i]);
  const ok = (v) => v && (okYr(v, 2) || (both && okYr(v, 0)));
  const pos = ["C", "1B", "2B", "3B", "SS", "OF"].filter((p) => ok(e[p]));
  const asPos = (p) => ["LF", "CF", "RF"].includes(p) ? "OF" : p;
  if (E.primary && ["C", "1B", "2B", "3B", "SS", "OF"].includes(asPos(r.pos)) && !pos.includes(asPos(r.pos))) pos.push(asPos(r.pos));
  if (E.mostPlayed && !pos.length) {
    const top = ["C", "1B", "2B", "3B", "SS", "OF", "DH"].filter((p) => e[p]).sort((a, b) => e[b][2] - e[a][2])[0];
    if (top && top !== "DH" && e[top][2] > 0) pos.push(top);
  }
  // No qualifying position: prospects (no MLB games anywhere) keep their listed position; others are UTIL only.
  const anyGames = Object.values(e).some((v) => v[0] + v[2] > 0);
  const prim = ["LF", "CF", "RF"].includes(r.pos) ? "OF" : r.pos;
  if (!pos.length && !anyGames && ["C", "1B", "2B", "3B", "SS", "OF"].includes(prim)) pos.push(prim);
  return pos;
}
function hitterPool() {
  return DATA.hitters.filter((r) => (r.pa || 0) > 0).map((r) => {
    const pos = eligible(r);
    return { key: "h" + r.id, id: r.id, tab: "h", pit: false, r, s: HSTAT(r), pos, slots: [...pos, ...(pos.some((p) => p === "2B" || p === "SS") ? ["MI"] : []),
      ...(pos.some((p) => p === "1B" || p === "3B") ? ["CI"] : []), "UTIL"], vol: r0(r.g) };
  });
}
function pitcherPool() {
  const out = new Map();
  for (const r of DATA.pitchers) {
    if (r.role === "conversion") continue;
    out.set(r.id, { key: "p" + r.id, id: r.id, tab: "p", pit: true, r, sp: true, rp: false });
  }
  for (const r of DATA.relievers) {
    const o = out.get(r.id);
    if (o) { o.rp = true; o.rr = r; continue; }
    out.set(r.id, { key: "p" + r.id, id: r.id, tab: "r", pit: true, r, sp: false, rp: true });
  }
  return [...out.values()].filter((o) => (o.r.ip || 0) > 0).map((o) => {
    const r = o.r;
    o.s = { ip: r0(r.ip), k: r0(r.k), bb: r0(r.bb), hbp: r0(r.hbp), h: r0(r.h), hr: r0(r.hr), er: r0(r.er), w: r0(r.w), l: r0(r.l),
      sv: r0(r.sv), hld: r0(r.hld), qs: r0(r.qs), gs: r0(r.gs), tbf: r0(r.tbf) };
    // Platform eligibility from official appearances: SP with enough starts, RP with enough relief
    // outings (current season, optionally the one before). Pitchers with no MLB appearances use
    // their projected role.
    const e = DATA.pelig?.[String(o.id)], E = FSTATE.elig, sp = E.spThr ?? 5, rp = E.rpThr ?? 5;
    if (e && e[2] + e[3] + (E.both ? e[0] + e[1] : 0) > 0) {
      o.projSp = o.sp; o.projRp = o.rp;
      o.sp = e[2] >= sp || (E.both && e[0] >= sp);
      o.rp = e[3] >= rp || (E.both && e[1] >= rp);
      if (!o.sp && !o.rp) { o.sp = o.projSp; o.rp = o.projRp; }
    }
    o.pos = [o.sp && "SP", o.rp && "RP"].filter(Boolean);
    o.slots = [...o.pos, "P"];
    o.vol = o.s.ip;
    return o;
  });
}

/* ---------- scenarios: floor / ceiling / healthy ---------- */
function scenario(o, which) {
  const r = o.r, s = { ...o.s };
  if (!o.pit) {
    const base = r.pa || 1;
    const pa = which === "lo" ? r.pa10 : which === "hi" ? Math.min(r.pa90, 720) : r.pah;
    const f = pa != null ? pa / base : 1;
    const wq = which === "lo" ? r.woba10 : which === "hi" ? r.woba90 : r.woba;
    const q = r.woba && wq ? 1 + 0.5 * (wq / r.woba - 1) : 1;
    for (const k in s) s[k] *= f;
    for (const k of ["h", "b1", "b2", "b3", "hr", "bb", "hbp", "r", "rbi"]) s[k] *= q;
    return s;
  }
  const ip = which === "lo" ? r.ip10 : which === "hi" ? r.ip90 : (r.iph ?? r.ip);
  const f = ip != null && r.ip ? ip / r.ip : 1;
  for (const k in s) s[k] *= f;
  const rr = o.rr || (o.rp ? r : null);
  if (rr && rr.sv10 != null && which !== "healthy") s.sv = which === "lo" ? rr.sv10 : rr.sv90;
  return s;
}

/* ---------- valuation ---------- */
function catList(pit) {
  const keys = pit ? FSTATE.pc : FSTATE.hc;
  return (pit ? PCATS : HCATS).filter((c) => keys.includes(c.k));
}
function baseline(pool, pit) {
  const b = {};
  for (const c of catList(pit)) {
    if (c.ops) {
      const n1 = pool.reduce((a, o) => a + o.s.h + o.s.bb + o.s.hbp, 0), d1 = pool.reduce((a, o) => a + o.s.ab + o.s.bb + o.s.hbp + o.s.sf, 0);
      const n2 = pool.reduce((a, o) => a + tb(o.s), 0), d2 = pool.reduce((a, o) => a + o.s.ab, 0);

    teams.sort((a, b) => sk === "team" ? sd * a.team.localeCompare(b.team) : sd * ((a[sk] ?? -1e9) - (b[sk] ?? -1e9)));
    const open = teams.find((t) => t.team === L.open);
    const unm = teams.reduce((a, t) => a + t.unmatched, 0);
    body = `
      <div class="mscroll"><table class="mini"><thead><tr>${LG_COLS.filter(([k]) => (k !== "lineupPts" || F.mode === "pts") && (hasCap || !["pen", "used", "capMax"].includes(k)) && (L.salaries || !["salary", "room", "keep"].includes(k))).map(([k, l]) =>
        `<th${k === sk ? ` aria-sort="${sd > 0 ? "ascending" : "descending"}"` : ""}><button class="plink" type="button" data-lgsort="${k}">${l}${k === sk ? (sd > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead>
      <tbody>${teams.map((t) => `<tr data-lgteam="${t.team.replace(/"/g, "&quot;")}" tabindex="0" style="cursor:pointer" aria-selected="${t.team === L.open}">
        <td>${t.team === L.my ? "★ " : ""}${t.team}</td><td>${t.n}</td>${L.salaries ? `<td>$${f0(t.salary)}</td>` : ""}${hasCap ? `<td>${t.pen ? "$" + f0(t.pen) : "–"}</td><td>$${f0(t.used)}</td><td title="${t.loans ? (t.loans > 0 ? "+" : "−") + "$" + Math.abs(t.loans) + " net loans" : ""}">$${f0(t.capMax)}</td>` : ""}${L.salaries ? `<td>${money(t.room)}</td>` : ""}<td>$${f0(t.value)}</td>${L.salaries ? `<td>$${f0(t.keep)}</td>` : ""}<td>$${f0(t.lineupVal)}</td>${F.mode === "pts" ? `<td>${f0(t.lineupPts)}</td>` : ""}</tr>`).join("")}</tbody></table></div>
      <p class="note">GOOSE value sums each rostered player's value (negatives count as zero: you'd cut them). Keeper surplus sums value minus salary for players worth more than they cost. Lineup value${F.mode === "pts" ? " and points" : ""} use the best lineup from the roster${F.rate ? " under the games and innings caps" : ""}. ${hasCap ? "Cap used = salaries + cut penalties; cap = $400 plus loans in, minus loans out (from each team page)." : "Uploaded CSVs carry salaries only: cut penalties and loans aren't included."} Salaries are as exported (add Ottoneu's end-of-season raises if they haven't posted yet).${unm ? ` ${unm} rostered players have no GOOSE projection (mostly deep minor leaguers) and count as $0.` : ""}</p>
      ${open ? `<h3>${open.team}</h3><div class="mscroll"><table class="mini"><thead><tr><th>Player</th><th>Pos</th><th>Salary</th><th>GOOSE $</th><th>Surplus</th><th>${F.rate ? "Lineup share" : "Starter"}</th></tr></thead><tbody>${
        [...open.ps].sort((a, b) => b.val - a.val).map((p) => `<tr><td>${p.name}</td><td>${p.pos}</td><td>$${f0(p.salary)}</td><td>${p.o ? money(p.val) : "–"}</td>
          <td style="color:${p.surplus >= 0 ? "var(--good)" : "var(--bad)"}">${p.o ? (p.surplus >= 0 ? "+" : "−") + "$" + Math.abs(p.surplus).toFixed(0) : "–"}</td><td>${F.rate ? pct(p.share, 0) : p.share ? "✓" : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">Click a team to see its roster.</p>`}
      <div class="frow"><label class="fld">My team<select id="fLgMine"><option value="">–</option>${teams.map((t) => t.team).sort().map((n) => `<option ${n === L.my ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <button class="btn" type="button" id="fLgKeep">Send rosters to the draft tracker as keepers</button>
        <button class="btn" type="button" id="fLgClear">Remove league</button></div>`;
  }
  const pre = DATA.leagues || [];
  return `<div class="panel"><h2>${L?.platform === "fantrax" ? "Fantrax" : "Ottoneu"} league${L?.name ? ` · ${L.name}` : ""}</h2>
    ${L?.platform === "fantrax" && L.season && L.season < 2026 ? `<p class="note"><b>Note:</b> this league ID is for the ${L.season} season; rosters reflect that season. Fantrax gives each season its own league ID.</p>` : ""}
    ${pre.length ? `<div class="frow"><label class="fld wide">Loaded leagues<select id="fLgPre"><option value="">Choose a league…</option>${pre.map((l) => `<option value="${l.id}" ${String(l.id) === String(L?.id) ? "selected" : ""}>${l.platform === "fantrax" ? "Fantrax" : "Ottoneu"}: ${l.name} (${l.scoring}, ${l.teams} teams)</option>`).join("")}</select></label></div>` : ""}
    <p class="note">Fantrax leagues load by league ID at build time (the code in the league's URL). Any other Ottoneu league: enter its ID (the number in the league's URL), open the export link in your browser to download the rosters CSV, then drop the file here or paste its contents. The page itself can't fetch from Ottoneu, so leagues load either at build time or through your browser.${F.preset.startsWith("otto") ? "" : " <b>Tip:</b> pick an Ottoneu format above so values use Ottoneu scoring and the $400 cap."}</p>
    <div class="frow"><label class="fld">League ID<input id="fLgId" type="text" inputmode="numeric" value="${id}" style="font:inherit;width:7em;padding:7px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink)"></label>
      ${url ? `<span class="note">Export: <a href="${url}" target="_blank" rel="noopener">${url}</a></span>` : ""}</div>
    <div class="frow"><label class="fld">Rosters CSV file<input id="fLgFile" type="file" accept=".csv,text/csv,text/plain"></label></div>
    <textarea class="paste" id="fLgPaste" placeholder="…or paste the CSV here (header line included)"></textarea>
    <div class="frow"><button class="btn primary" type="button" id="fLgImport">Import pasted rosters</button><span class="note" id="fLgMsg">${L?.at ? `Rosters imported ${L.at}.` : ""}</span></div>
    ${body}</div>`;
}

function summaryHTML() {
  const F = FSTATE, R = F.roster, mine = FV.all.filter((o) => F.drafted[o.key]?.mine);
  const mySpent = mine.reduce((a, o) => a + F.drafted[o.key].price, 0);
  const myVal = mine.reduce((a, o) => a + o.val, 0);
  const repl = (g, keys) => keys.filter((k) => FV.res[g].repl[k] != null && (k === "UTIL" || k === "P" || R[k] > 0 || g === "h")).map((k) =>
    `<div class="kv"><span>${k}</span><b>${F.mode === "cats" ? FV.res[g].repl[k].toFixed(2) + " z" : F.rate ? FV.res[g].repl[k].toFixed(2) + (g === "h" ? " pts/G" : " pts/IP") : f0(FV.res[g].repl[k]) + " pts"}</b></div>`).join("");
  return `
  <div class="twocol">
    <div class="panel"><h3>League economy</h3>
      <div class="kv"><span>Hitter share of auction dollars</span><b>${pct(FV.hShare, 0)}${F.split === "auto" ? " (auto)" : ""}</b></div>
      <div class="kv"><span>Dollars above minimum bids</span><b>$${f0(FV.D)}</b></div>
      <div class="kv"><span>Drafted so far</span><b>${FV.nDr} players · $${f0(FV.spent)}</b></div>
      <div class="kv"><span>Inflation on remaining players</span><b>${FV.nDr ? ((FV.infl - 1) * 100).toFixed(1) + "%" : "–"}</b></div>
      <div class="kv"><span>My team</span><b>${mine.length} players · paid $${f0(mySpent)} for $${f0(myVal)} of value</b></div>
      <h3 style="margin-top:6px">Replacement level by position</h3>${repl("h", ["C", "1B", "2B", "3B", "SS", "OF", "UTIL"])}${repl("p", ["SP", "RP", "P"])}
    </div>
    <div class="panel"><h3>Keepers and draft results</h3>
      <p class="note">Paste one player per line as <b>Name, price</b>; add <b>, mine</b> for your own players. Keepers count the same as drafted players, so remaining values inflate (or deflate) automatically.</p>
      <textarea class="paste" id="fPaste" placeholder="Bobby Witt Jr., 52, mine&#10;Tarik Skubal, 38"></textarea>
      <div class="frow"><button class="btn primary" type="button" id="fImport">Add to tracker</button><button class="btn" type="button" id="fClear">Clear tracker</button>
        <label class="toggle" style="padding:7px 10px"><input id="fHide" type="checkbox" ${F.hideDrafted ? "checked" : ""}> Hide drafted</label></div>
      <p class="note" id="fImportMsg"></p>
    </div>
  </div>`;
}

function renderFantasy() {
  // League tab: open the first preloaded league if none is loaded yet.
  if (state.tab === "g" && !FSTATE.league?.players?.length && DATA.leagues?.length) loadPreloaded(DATA.leagues[0].id);
  valuate();
  if (state.tab === "g") {
    $("fantasyView").innerHTML = `${leagueHTML()}
      <details class="fdet panel" ${FSTATE.lgOpen ? "open" : ""}><summary id="fLgSet">Valuation settings (${PRESETS[FSTATE.preset]?.label ?? "Custom"}${FSTATE.custom ? ", edited" : ""} · ${FSTATE.roster.teams} teams)</summary>${settingsHTML()}</details>`;
    return;
  }
  const F = FSTATE;
  const rows = rowsFor();
  if (!F.sel || !FV.all.some((o) => o.key === F.sel)) F.sel = rows[0]?.key ?? null;
  const sel = FV.all.find((o) => o.key === F.sel);
  $("fantasyView").innerHTML = `
    ${settingsHTML()}
    <div class="frow">
      <label class="search" style="flex:1 1 240px"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <input id="fQ" type="search" placeholder="Search players or teams" autocomplete="off" aria-label="Search fantasy values" value="${F.q.replace(/"/g, "&quot;")}"></label>
      <div class="seg" role="group" aria-label="Player group">${[["all", "All"], ["h", "Hitters"], ["p", "Pitchers"]].map(([k, l]) => `<button type="button" data-fshow="${k}" aria-pressed="${F.show === k}">${l}</button>`).join("")}</div>
      <select id="fPos" aria-label="Position"><option value="">Any position</option>${["C", "1B", "2B", "3B", "SS", "OF", "UTIL", "SP", "RP"].map((p) => `<option ${F.pos === p ? "selected" : ""}>${p}</option>`).join("")}</select>
    </div>
    <div class="fmain">
      <section class="tablebox"><div class="tablemeta"><span>${rows.length} players · ${PRESETS[F.preset]?.label ?? "Custom"}${F.custom ? " (edited)" : ""} · ${F.roster.teams} teams, $${F.roster.budget}</span><span>${F.adp !== "none" && DATA.adp ? `ADP: NFBC ${DATA.adp.label}. ` : ""}Click a row for the breakdown and draft tracker.</span></div>
        <div id="ftable">${tableHTML(rows)}</div></section>
      <aside class="detail" id="fdetail">${detailHTML(sel)}</aside>
    </div>
    ${summaryHTML()}`;
}
function refreshTable() {
  applyRisk(); applyInflation();
  const rows = rowsFor();
  $("ftable").innerHTML = tableHTML(rows);
  $("fdetail").innerHTML = detailHTML(FV.all.find((o) => o.key === FSTATE.sel));
}
function markCustom() { FSTATE.custom = true; }

const FV_EL = $("fantasyView");
FV_EL.addEventListener("change", (e) => {
  const t = e.target, F = FSTATE, R = F.roster;
  if (t.id === "fPreset") { if (t.value !== "custom") applyPreset(t.value); }
  else if (t.id === "fMode") { F.mode = t.value; if (t.value === "pts" && !Object.keys(F.hw).length) { F.hw = { ...PRESETS.ottoFg.hw }; F.pw = { ...PRESETS.ottoFg.pw }; } markCustom(); }
  else if (t.id === "fRate") { F.rate = t.value === "1"; markCustom(); }
  else if (t.id === "fTeams") { R.teams = Math.max(2, Math.min(40, +t.value || 12)); markCustom(); }
  else if (t.id === "fTeamsSel") { if (t.value === "custom") F.teamsCustom = true; else { F.teamsCustom = false; R.teams = +t.value; } markCustom(); }
  else if (t.id === "fBudget") { R.budget = Math.max(1, +t.value || 260); markCustom(); }
  else if (t.id === "fMin") { R.minBid = Math.max(0, +t.value); markCustom(); }
  else if (t.id === "fSplit") { if (t.value === "auto") F.split = "auto"; else { F.split = "manual"; F.splitPct = +t.value; } }
  else if (t.id === "fRisk") { F.risk = +t.value; fsave(); renderFantasy(); return; }
  else if (t.id.startsWith("fs_")) { R[t.id.slice(3)] = Math.max(0, +t.value || 0); markCustom(); }
  else if (t.id === "fRule") { if (t.value !== "custom") F.elig = { ...eligOf(t.value), both: F.elig.both }; else F.elig.rule = "custom"; markCustom(); }
  else if (t.id === "fGThr") { F.elig.gThr = Math.max(1, +t.value || 1); F.elig.rule = "custom"; markCustom(); }
  else if (t.id === "fGsThr") { F.elig.gsThr = Math.max(1, +t.value || 1); F.elig.rule = "custom"; markCustom(); }
  else if (t.id === "fBoth") { F.elig.both = t.checked; markCustom(); }
  else if (t.id === "fSpThr") { F.elig.spThr = Math.max(1, +t.value || 1); F.elig.rule = "custom"; markCustom(); }
  else if (t.id === "fRpThr") { F.elig.rpThr = Math.max(1, +t.value || 1); F.elig.rule = "custom"; markCustom(); }
  else if (t.id === "fOhtani") { F.ohtani = t.value; }
  else if (t.id === "fWaivers") { R.waivers = t.value; if (t.value === "none" && R.benchP == null) R.benchP = 0.55; markCustom(); }
  else if (t.id === "fBenchP") { R.benchP = Math.min(1, Math.max(0, (+t.value || 0) / 100)); markCustom(); }
  else if (t.id === "fAdp") { F.adp = t.value; }
  else if (t.dataset.cat) { const arr = t.dataset.cat === "p" ? F.pc : F.hc; if (t.checked) arr.push(t.value); else arr.splice(arr.indexOf(t.value), 1); if (!arr.length) arr.push(t.value); markCustom(); }
  else if (t.dataset.pts) { (t.dataset.pts === "p" ? F.pw : F.hw)[t.dataset.k] = +t.value || 0; markCustom(); }
  else if (t.id === "fPos") { F.pos = t.value; fsave(); refreshTable(); return; }
  else if (t.id === "fHide") { F.hideDrafted = t.checked; fsave(); refreshTable(); return; }
  else if (t.id === "fLgId") {
    const v = t.value.trim();
    if ((DATA.leagues || []).some((l) => String(l.id) === v)) { const msg = loadPreloaded(v); fsave(); renderFantasy(); $("fLgMsg").textContent = msg; return; }
    F.league = { ...(F.league || { players: [] }), id: v };
  }
  else if (t.id === "fLgPre") { if (!t.value) return; const msg = loadPreloaded(t.value); fsave(); renderFantasy(); $("fLgMsg").textContent = msg; return; }
  else if (t.id === "fLgMine") { F.league.my = t.value; }
  else if (t.id === "fLgFile") {
    const file = t.files && t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const msg = importLeague(String(rd.result)); fsave(); renderFantasy(); $("fLgMsg").textContent = msg; };
    rd.readAsText(file); return;
  }
  else return;
  fsave(); renderFantasy();
});
FV_EL.addEventListener("input", (e) => { if (e.target.id === "fQ") { FSTATE.q = e.target.value; const rows = rowsFor(); if (rows.length && FSTATE.q.trim()) FSTATE.sel = rows[0].key; refreshTable(); } });
FV_EL.addEventListener("click", (e) => {
  const F = FSTATE;
  const s = e.target.closest("button[data-fsort]");
  if (s) { const k = s.dataset.fsort; F.sort = [k, F.sort[0] === k ? -F.sort[1] : (k === "name" ? 1 : -1)]; refreshTable(); return; }
  const sh = e.target.closest("button[data-fshow]");
  if (sh) { F.show = sh.dataset.fshow; if (F.sort[0].startsWith("c:")) F.sort = ["val", -1]; fsave(); renderFantasy(); return; }
  if (e.target.id === "fDraft") { F.drafted[F.sel] = { price: Math.max(0, +$("fPrice").value || 0), mine: $("fMine").checked }; fsave(); renderFantasy(); return; }
  if (e.target.id === "fUndraft") { delete F.drafted[F.sel]; fsave(); renderFantasy(); return; }
  if (e.target.id === "fClear") { F.drafted = {}; fsave(); renderFantasy(); return; }
  if (e.target.id === "fLgSet") { FSTATE.lgOpen = !e.target.parentElement.open; return; }
  if (e.target.id === "fLgImport") { const msg = importLeague($("fLgPaste").value); fsave(); renderFantasy(); $("fLgMsg").textContent = msg; return; }
  if (e.target.id === "fLgClear") { F.league = null; fsave(); renderFantasy(); return; }
  if (e.target.id === "fLgKeep") {
    for (const t of leagueTeams()) for (const p of t.ps) if (p.o) F.drafted[p.o.key] = { price: p.salary, mine: t.team === F.league.my };
    fsave(); renderFantasy(); return;
  }
  const lgs = e.target.closest("button[data-lgsort]");
  if (lgs) { const k = lgs.dataset.lgsort, cur = F.league.sort || ["value", -1]; F.league.sort = [k, cur[0] === k ? -cur[1] : (k === "team" ? 1 : -1)]; fsave(); renderFantasy(); return; }
  const lgt = e.target.closest("tr[data-lgteam]");
  if (lgt) { F.league.open = F.league.open === lgt.dataset.lgteam ? null : lgt.dataset.lgteam; fsave(); renderFantasy(); return; }
  if (e.target.id === "fImport") {
    const miss = []; let n = 0;
    for (const line of $("fPaste").value.split(/\n+/)) {
      const parts = line.split(",").map((x) => x.trim()).filter(Boolean); if (!parts.length) continue;
      const name = fold(parts[0]), price = Number((parts[1] || "").replace(/[$]/g, "")) || 0, mine = parts.slice(2).some((p) => /mine|me|my/i.test(p));
      const hit = FV.all.filter((o) => fold(o.r.name) === name).sort((a, b) => b.val - a.val)[0];
      if (hit) { F.drafted[hit.key] = { price, mine }; n++; } else miss.push(parts[0]);
    }
    fsave(); renderFantasy();
    $("fImportMsg").textContent = `Added ${n}.${miss.length ? " Not found: " + miss.join(", ") + "." : ""}`;
    return;
  }
  const tr = e.target.closest("tr[data-fkey]");
  if (tr) { F.sel = tr.dataset.fkey; document.querySelectorAll("#fbody tr").forEach((x) => x.setAttribute("aria-selected", x.dataset.fkey === F.sel)); $("fdetail").innerHTML = detailHTML(FV.all.find((o) => o.key === F.sel)); }
});
FV_EL.addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr[data-fkey]"); if (!tr) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tr.click(); }
  if (e.key === "ArrowDown" && tr.nextElementSibling) { tr.nextElementSibling.focus(); e.preventDefault(); }
  if (e.key === "ArrowUp" && tr.previousElementSibling) { tr.previousElementSibling.focus(); e.preventDefault(); }
});
render();
</script>
